name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # files that never reach dist/: a deploy renames the service worker's cache,
    # so a docs-only push would make every returning visitor fetch the data again
    paths-ignore:
      - '**.md'
      - 'design/**'
      - 'script/*.py'
      - 'script/*.sh'
      - 'tasks/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel any in-progress deploy for the same branch so stale runs don't
# queue behind a newer push and waste runner minutes.
concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  # one job: a second one waited ~6 s for its own runner just to deploy
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # pinned, not latest: a silent Bun bump broke tocador's S3Client on 2026-08-20
          bun-version: 1.4.2

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # zopfli das malhas (script/comprime_malhas.py, chamado pelo build): sem o uv o build segue sem as cópias .gz
      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Build
        run: bun run build

      # teste de fumaça: o dist/ abre sem erro de JS e a cidade termina de desenhar, senão não publica
      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-${{ hashFiles('bun.lock') }}

      - name: Smoke test
        run: |
          # sem --with-deps: o apt das dependências levava ~40 s por deploy, e o runner do Ubuntu já traz as bibliotecas do Chrome
          bunx playwright install chromium
          python3 -m http.server -d dist 8000 >/dev/null 2>&1 &
          sleep 1
          bun script/smoke.mjs http://localhost:8000/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist'
          retention-days: 3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
