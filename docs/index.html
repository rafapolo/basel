<style>
  :root {
    --papel: #efe6d2; --papel2: #e4d8bd; --tinta: #1d1812; --suave: #6b5d4a; --linha: rgba(29,24,18,.18);
    --rubro: #b3261e; --ouro: #d9a441;
    --lb: clamp(0px, calc((100vh - 100vw / 2.39) / 2), 16vh); --ease: cubic-bezier(.4,0,.2,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--papel); color: var(--tinta); font: 14px/1.45 Inter, system-ui, sans-serif; }
  canvas#cena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; color: inherit; }

  #topo { position: fixed; top: 14px; left: 16px; right: 16px; display: flex; align-items: flex-start; gap: 12px; pointer-events: none; z-index: 10; }
  #marca { pointer-events: auto; background: rgba(239,230,210,.88); border: 1px solid var(--linha); border-radius: 6px; padding: 8px 14px 9px; backdrop-filter: blur(4px); }
  #marca { display: flex; align-items: center; gap: 10px; }
  #marca .stab { height: 40px; width: auto; flex: none; fill: currentColor; }
  #marca h1 { margin: 0; font: 400 30px/1 'IM Fell English', Georgia, serif; letter-spacing: .01em; }
  #marca p { margin: 3px 0 0; font-size: 12px; color: var(--suave); }
  #topo .acoes { margin-left: auto; display: flex; gap: 8px; pointer-events: auto; }
  .btn { border: 1px solid var(--linha); background: rgba(239,230,210,.9); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: 13px; }
  .btn:hover { background: var(--papel2); }
  #tour-abrir { background: var(--tinta); color: var(--papel); border-color: var(--tinta); display: inline-flex; align-items: center; gap: 8px; }
  #tour-abrir::before { content: ""; border-left: 8px solid var(--ouro); border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
  #tour-abrir:hover { background: #000; }
  #jogo-abrir { background: #b3161c; color: #fff; border-color: #b3161c; display: inline-flex; align-items: center; gap: 7px; }
  /* duas rodas e o quadro, desenhados com gradientes (o texto do botão é trocado pelo i18n, então nada de svg dentro) */
  #jogo-abrir::before { content: ""; width: 20px; height: 11px; background:
    radial-gradient(circle at 4px 7px, transparent 2.2px, #fff 2.6px, #fff 3.6px, transparent 4px),
    radial-gradient(circle at 16px 7px, transparent 2.2px, #fff 2.6px, #fff 3.6px, transparent 4px),
    linear-gradient(-28deg, transparent 44%, #fff 45%, #fff 55%, transparent 56%) 5px 1px / 10px 7px no-repeat; }
  #jogo-abrir:hover { background: #8f0f14; }
  /* pílulas de ligar e desligar (como os chips de ../cantography): ícone e palavra, preenchidas quando ligadas; a caixa de
     seleção fica dentro, invisível, e é ela que o resto do código escuta */
  .chip { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 33px; padding: 0 13px; border: 1px solid var(--linha); border-radius: 999px; background: rgba(239,230,210,.9); font-weight: 600; font-size: 13px; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; transition: background .2s var(--ease), color .2s var(--ease); }
  .chip input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
  .chip:has(input:checked) { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
  .chip:has(input:focus-visible) { outline: 2px solid var(--ouro); outline-offset: 2px; }
  @media (hover: hover) { .chip:hover { background: var(--papel2); } .chip:has(input:checked):hover { background: #000; } }
  /* lua: um círculo com outro por cima, recortado com gradiente; nota musical, riscada quando mudo */
  #chip-noite::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 70% 32%, transparent 4.6px, currentColor 5px); }
  #chip-som::before { content: "♪"; font-size: 14px; line-height: 1; }
  #chip-som:not(:has(input:checked))::before { text-decoration: line-through; opacity: .55; }
  @media (max-width: 640px) { /* no telefone: só os ícones, botões de 36 px para o dedo; a bici também */
    #jogo-abrir { font-size: 0; padding: 0 11px; gap: 0; height: 36px; }
    #topo .acoes { gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
    .chip { font-size: 0; gap: 0; width: 36px; height: 36px; padding: 0; justify-content: center; }
    #tour-abrir { height: 36px; padding: 0 12px; }
    #linguas button { padding: 0 9px; height: 34px; }
  }
  #linguas { display: inline-flex; border: 1px solid var(--linha); border-radius: 999px; overflow: hidden; background: rgba(239,230,210,.9); }
  #linguas button { border: 0; background: none; padding: 7px 10px; font: 600 12px Inter, sans-serif; cursor: pointer; color: var(--suave); }
  #linguas button[aria-pressed="true"] { background: var(--tinta); color: var(--papel); }
  body.noite #linguas { background: rgba(24,22,30,.86); border-color: rgba(232,225,208,.18); }
  body.noite #linguas button { color: #a99f8c; }

  #painel { position: fixed; right: 16px; bottom: 16px; width: 300px; z-index: 10; background: rgba(239,230,210,.92); border: 1px solid var(--linha); border-radius: 8px; padding: 14px 16px; backdrop-filter: blur(4px); }
  #agora { font: 400 54px/1 'IM Fell English', Georgia, serif; display: flex; align-items: baseline; gap: 10px; font-variant-numeric: tabular-nums; margin-bottom: 8px; }
  #agora small { font: 500 12px Inter, sans-serif; color: var(--suave); }
  /* estação: etiqueta com ícone (as cores da estação, discretas) */
  #estacao.tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 7px; border-radius: 999px; border: 1px solid var(--linha); font-weight: 600; color: var(--tinta); align-self: center; }
  #estacao svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  #estacao.inverno { background: #e3e9f0; color: #2f4a6b; } #estacao.primavera { background: #e4efd9; color: #3d6b2a; }
  #estacao.verao { background: #f6e6b8; color: #7a5a10; } #estacao.outono { background: #f3dcc8; color: #8a4219; }
  #estacao.primavera circle { fill: #f2a7c0; stroke: #c25a82; }
  .data-dir { display: inline-flex; align-items: center; gap: 8px; }
  #c-agora { border: 1px solid var(--linha); background: transparent; color: inherit; border-radius: 999px; padding: 1px 9px; font: 600 11px Inter, sans-serif; cursor: pointer; }
  #c-agora:hover { background: var(--tinta); color: var(--papel); }
  #c-agora[hidden] { display: none; }
  .chaves { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  /* chaves: o rótulo inteiro é o botão (sem interruptor desenhado): contorno quando desligado, preenchido quando ligado; a
     caixa de seleção fica invisível, mas segue lá para o teclado e o leitor de tela */
  .chave { position: relative; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 13px; line-height: 1.2; cursor: pointer; padding: 7px 10px; border: 1px solid var(--linha); border-radius: 8px; user-select: none; transition: background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease); }
  .chave:hover { background: rgba(29,24,18,.06); }
  .chave input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
  .chave:has(input:checked) { background: var(--tinta); border-color: var(--tinta); color: var(--papel); }
  .chave:has(input:checked):hover { background: #3a3128; }
  .chave:has(input:focus-visible) { outline: 2px solid var(--ouro); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .chave { transition: none; } }
  #sol-ctl { margin: 0 0 10px; font-size: 12px; color: var(--suave); }
  #sol-ctl label { display: flex; justify-content: space-between; }
  #sol-ctl output { font-variant-numeric: tabular-nums; color: var(--tinta); font-weight: 600; }
  #c-hora, #c-data { width: 100%; margin: 4px 0; accent-color: var(--ouro); }
  .sol-linha { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #sol-info { font-variant-numeric: tabular-nums; }
  body.noite #sol-ctl, body.noite #sol-ctl output { color: #c9c0ac; }
  .nota { font-size: 11px; color: var(--suave); margin: 10px 0 0; border-top: 1px solid var(--linha); padding-top: 8px; }
  #legenda-linhas { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 0; }
  #legenda-linhas span { min-width: 22px; padding: 1px 6px; border-radius: 4px; background: var(--c); color: #fff; font: 700 11px Inter, sans-serif; text-align: center; text-shadow: 0 1px 1px rgba(0,0,0,.35); }
  #legenda-linhas[hidden] { display: none; }
  .nota a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }

  #ficha { position: fixed; left: 16px; bottom: 44px; width: min(330px, calc(100vw - 32px)); z-index: 11; background: var(--papel); border: 1px solid var(--tinta); border-radius: 6px; padding: 12px 14px; box-shadow: 4px 4px 0 var(--tinta); }
  #ficha[hidden] { display: none; }
  #ficha h2 { margin: 0 20px 2px 0; font: 400 22px/1.15 'IM Fell English', Georgia, serif; }
  #ficha .end { color: var(--suave); font-size: 12px; margin-bottom: 8px; }
  #ficha dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 13px; }
  #ficha dt { color: var(--suave); }
  #ficha dd { margin: 0; font-variant-numeric: tabular-nums; }
  #ficha a { color: var(--rubro); }
  #ficha .x { position: absolute; top: 6px; right: 8px; border: 0; background: none; font-size: 18px; cursor: pointer; color: var(--suave); }

  #creditos { position: fixed; left: 16px; bottom: 12px; z-index: 9; font-size: 11px; color: var(--suave); }
  #creditos a { color: inherit; }
  #carregando { position: fixed; inset: 0; display: grid; place-items: center; z-index: 50; background: var(--papel); font: italic 22px 'IM Fell English', Georgia, serif; transition: opacity .6s; }
  #carregando.fora { opacity: 0; pointer-events: none; }
  body.sem-gl::after { content: '↻'; position: fixed; inset: 0; display: grid; place-items: center; z-index: 60; background: var(--papel); font: 48px Georgia, serif; color: var(--ouro); }
  #carregando { transition: opacity .6s, background-color .5s; }
  #carregando .caixa { display: grid; justify-items: center; gap: 14px; padding: 14px 22px; margin: 0 16px; border-radius: 8px; background: rgba(239,230,210,.86); }
  #carregando .barra { width: min(280px, 70vw); height: 4px; border-radius: 2px; background: rgba(40,30,20,.14); overflow: hidden; }
  #carregando .barra i { display: block; height: 100%; background: var(--ouro); transform: scaleX(0); transform-origin: left; transition: transform .35s ease-out; }
  #carregando small { font: 500 12px system-ui, sans-serif; font-style: normal; opacity: .6; min-height: 1.2em; }

  body.noite #marca, body.noite #painel { background: rgba(24,22,30,.86); color: #e8e1d0; border-color: rgba(232,225,208,.18); }
  body.noite .chave { border-color: rgba(232,225,208,.18); }
  body.noite .chave:hover { background: rgba(232,225,208,.06); }
  body.noite .chave:has(input:checked) { background: var(--ouro); border-color: var(--ouro); color: #1d1812; }
  body.noite #estacao.tag { background: rgba(232,225,208,.12); color: #e8e1d0; border-color: rgba(232,225,208,.2); } body.noite #marca p, body.noite #agora small, body.noite .nota, body.noite #creditos { color: #a99f8c; }
  body.noite .chip { background: rgba(24,22,30,.86); color: #e8e1d0; border-color: rgba(232,225,208,.18); }
  body.noite .chip:has(input:checked) { background: var(--ouro); color: #1d1812; border-color: var(--ouro); }
  body.noite .btn:not(#tour-abrir):not(#jogo-abrir) { background: rgba(24,22,30,.86); color: #e8e1d0; border-color: rgba(232,225,208,.18); }

  /* ---------- tour: faixas de cinema 2.39:1, legenda com kicker e frase, linha de progresso ---------- */
  body.touring #painel, body.touring #topo, body.touring #ficha, body.touring #creditos { opacity: 0; pointer-events: none; transition: opacity .5s; }
  #tour { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
  #tour[hidden] { display: none; }
  #tour .bar { position: absolute; left: 0; right: 0; height: var(--lb); background: #000; transform: scaleY(0); transition: transform 900ms var(--ease); }
  #tour .bar.top { top: 0; transform-origin: top; }
  #tour .bar.bottom { bottom: 0; transform-origin: bottom; }
  #tour.on .bar { transform: scaleY(1); }
  #tour-progress { position: absolute; left: 0; right: 0; bottom: var(--lb); height: 2px; background: rgba(239,230,210,.14); }
  #tour-progress i { display: block; height: 100%; background: var(--ouro); transform: scaleX(0); transform-origin: left; }
  #tour-left { position: absolute; right: 10px; bottom: calc(var(--lb) + 6px); font: 12px ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; color: var(--ouro); }
  #tour-ano { position: absolute; right: 18px; top: calc(var(--lb) + 14px); font: 400 clamp(40px, 7vw, 92px)/1 'IM Fell English', Georgia, serif; color: #fff; text-shadow: 0 2px 18px rgba(0,0,0,.55); opacity: 0; transition: opacity .5s; font-variant-numeric: tabular-nums; }
  #tour-ano.on { opacity: 1; }
  #tour-parar, #tour-som { position: absolute; top: max(6px, calc(var(--lb) - 40px)); pointer-events: auto; padding: 5px 12px; font: 600 12px Inter, sans-serif; background: rgba(0,0,0,.6); color: var(--papel); border: 1px solid rgba(239,230,210,.25); border-radius: 999px; cursor: pointer; }
  #tour-parar { left: 16px; }
  #tour-som { left: 84px; color: var(--ouro); }
  #tour-som.mudo { color: rgba(239,230,210,.45); text-decoration: line-through; }
  #tour-progress, #tour-left, #tour-parar, #tour-som { transition: opacity 200ms; }
  #tour.saindo #tour-progress, #tour.saindo #tour-left, #tour.saindo #tour-parar, #tour.saindo #tour-som, #tour.saindo #tour-ano { opacity: 0; pointer-events: none; }
  #tour.saindo #tour-cap { opacity: 0; transition: opacity 200ms; }
  #tour-cap { position: absolute; left: 0; right: 0; bottom: var(--lb); padding: 60px 8vw 30px; text-align: center; background: linear-gradient(transparent, rgba(10,8,6,.55)); opacity: 0; transform: translateY(8px); transition: opacity 600ms, transform 600ms; }
  #tour-cap.on { opacity: 1; transform: none; }
  #tour-kicker { display: inline-block; padding: 6px calc(12px - .18em) 6px 12px; background: rgba(20,16,12,.74); border: 1px solid rgba(239,230,210,.2); border-radius: 4px; font: 600 clamp(10px, 1vw, 13px) Inter, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--ouro); margin-bottom: 10px; }
  #tour-kicker:empty { display: none; }
  #tour-line { display: block; font: 400 clamp(20px, 2.5vw, 36px)/1.22 'IM Fell English', Georgia, serif; color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,.75), 0 0 2px rgba(0,0,0,.6); max-width: 1100px; margin: 0 auto; }
  #tour-convite { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; background: rgba(15,12,8,.5); backdrop-filter: blur(2px); }
  #tour-convite[hidden] { display: none; }
  #tour-convite button { display: inline-flex; align-items: center; gap: 12px; font: 700 20px Inter, sans-serif; color: var(--tinta); background: var(--ouro); border: 0; border-radius: 999px; padding: 16px 30px; cursor: pointer; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  #tour-convite button::before { content: ""; border-left: 13px solid var(--tinta); border-top: 8px solid transparent; border-bottom: 8px solid transparent; }
  #tour-convite small { display: block; font: 500 13px Inter, sans-serif; opacity: .75; margin-top: 2px; text-align: left; }

  @media (max-width: 640px) {
    #marca h1 { font-size: 24px; } #marca p { display: none; } #marca .stab { height: 26px; } #marca { gap: 7px; }
    #painel { left: 16px; right: 16px; width: auto; bottom: 12px; padding: 10px 12px; }
    /* no telefone o painel abre recolhido (só o relógio): ocupava metade da tela; tocar no relógio abre e fecha */
    #agora { cursor: pointer; display: flex; align-items: baseline; gap: 8px; }
    #agora::after { content: "▾"; margin-left: auto; font: 16px Inter, sans-serif; opacity: .6; transition: transform .2s; }
    #painel.fechado #agora::after { transform: rotate(180deg); }
    #painel.fechado #sol-ctl, #painel.fechado .chaves { display: none; }
    #painel.fechado #agora { margin: 0; font-size: 30px; }
    #agora { font-size: 38px; }
    #creditos { display: none; }
    #ficha { bottom: auto; top: 76px; }
    .nota { display: none; }
  }
</style>
</head>
<body>
<canvas id="cena"></canvas>
<div id="carregando"><div class="caixa"><span data-i18n="carregando">Desenhando a cidade…</span><div class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div><small id="carga-etapa"></small></div></div>
<script>
// barra de progresso da abertura: os bytes das malhas grandes (compacta.js) levam até 68%; as etapas de montagem
// (cidade.js, carga.etapa) o resto. Nunca anda para trás.
(() => {
  // véu: opaco até a cidade ter uma prévia desenhada atrás (cidade.js chama carga.vista()); daí fica transparente com o
  // progresso e, no fim, já se vê a vista inicial (a da Pfalz, a do ?cam ou a do # do link) antes de o véu sumir
  const arq = new Map(); let feito = 0, vista = false;
  const pinta = (f) => {
    feito = Math.max(feito, Math.min(1, f));
    const el = document.querySelector('#carregando .barra');
    if (!el) return;
    el.firstElementChild.style.transform = `scaleX(${feito})`;
    el.setAttribute('aria-valuenow', Math.round(feito * 100));
    const a = vista ? Math.max(0.08, 1 - 0.92 * Math.min(1, (feito - 0.84) / 0.14)) : 1;
    document.getElementById('carregando').style.backgroundColor = `rgba(239,230,210,${a.toFixed(2)})`;
  };
  window.carga = {
    bytes(url, n, total) {
      arq.set(url, [n, total || arq.get(url)?.[1] || 0]);
      let a = 0, b = 0; for (const [x, y] of arq.values()) { a += x; b += Math.max(x, y); }
      if (b) pinta(0.04 + 0.64 * a / b);
    },
    etapa(f, txt) { pinta(f); const e = document.getElementById('carga-etapa'); if (e && txt) e.textContent = txt; },
    vista() { if (!vista) { vista = true; pinta(feito); } },
  };
})();
